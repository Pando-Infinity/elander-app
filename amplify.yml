version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm install 22
        - nvm use 22
        - npm install -g pnpm
        - pnpm install --frozen-lockfile
    build:
      commands:
        - AMPLIFY_BUILD=1 pnpm build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - .next/cache/**/*
      - node_modules/.cache/**/*
customHeaders:
  - pattern: '/sw.js'
    headers:
      - key: 'Cache-Control'
        value: 'public, max-age=0, must-revalidate'
  - pattern: '/workbox-*.js'
    headers:
      - key: 'Cache-Control'
        value: 'public, max-age=31536000, immutable'
